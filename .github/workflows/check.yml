name: Validate ROMEO OS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: romeo-os-website
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: romeo-os-demo-html
          path: demo-dist/index.html
